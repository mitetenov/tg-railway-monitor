name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # Standard library only; there is no go.sum.
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - name: Vet
        run: go vet ./...
      - name: Tests and race detector
        run: go test -race -count=1 -timeout=60s ./...

  docker-build:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v7
      - name: Read version
        id: version
        run: |
          version=$(cat version.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build local image for runtime checks
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tg-ticket-monitor:ci
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Runtime checks without credentials or network
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(docker inspect -f '{{.Architecture}}' tg-ticket-monitor:ci)" = "$EXPECTED_ARCH"
          docker run --rm --network none --read-only \
            --tmpfs /app/data:uid=1000,gid=1000,mode=700 \
            tg-ticket-monitor:ci --check
          test "$(docker run --rm --network none tg-ticket-monitor:ci --version)" = "$VERSION"
          test "$(docker inspect -f '{{.Config.User}}' tg-ticket-monitor:ci)" = "1000:1000"
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Push platform image by digest
        if: github.event_name == 'push'
        id: release
        uses: docker/build-push-action@v7
        with:
          context: .
          outputs: type=image,name=${{ secrets.DOCKER_USERNAME }}/tg-ticket-monitor,push-by-digest=true,name-canonical=true,push=true
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Export image digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload image digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    if: github.event_name == 'push'
    needs: [docker-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Publish multi-platform release
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/tg-ticket-monitor
          VERSION: ${{ needs.docker-build.outputs.version }}
        run: |
          sources=()
          for digest in *; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$VERSION" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw | \
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
