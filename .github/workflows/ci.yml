name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read and validate version
        id: version
        run: |
          version=$(cat version.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # Cache compiled standard-library packages, including race builds.
          # A stable key avoids uploading a new cache on every source change.
          cache: true
          cache-dependency-path: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./*.go)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Tests and race detector
        # Vet already ran, while -count=1 still executes every test on cache hits.
        run: go test -vet=off -race -count=1 -timeout=60s ./...

  docker-build:
    if: github.event_name == 'push'
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      DOCKER_BUILD_RECORD_RETENTION_DAYS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: tg-ticket-monitor:ci
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ needs.test.outputs.version }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Runtime checks without credentials or network
        id: checked
        shell: bash
        env:
          VERSION: ${{ needs.test.outputs.version }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          image_id=$(docker image inspect -f '{{.Id}}' tg-ticket-monitor:ci)
          test "$(docker image inspect -f '{{.Architecture}}' "$image_id")" = "$EXPECTED_ARCH"
          docker run --rm --network none --read-only \
            --tmpfs /app/data:uid=1000,gid=1000,mode=700 \
            "$image_id" --check
          test "$(docker run --rm --network none "$image_id" --version)" = "$VERSION"
          test "$(docker image inspect -f '{{.Config.User}}' "$image_id")" = "1000:1000"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Push checked image and export digest
        shell: bash
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/tg-ticket-monitor
          IMAGE_ID: ${{ steps.checked.outputs.image_id }}
          ARCH: ${{ matrix.arch }}
        run: |
          ref="$IMAGE:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          docker image tag "$IMAGE_ID" "$ref"
          docker image push "$ref"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    if: github.event_name == 'push'
    needs: [test, docker-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      # imagetools uses the runner's Buildx CLI; it needs no BuildKit daemon.
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Publish multi-platform release
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/tg-ticket-monitor
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          sources=()
          for digest in *; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$VERSION" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw | \
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
