name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # Standard library only; there is no go.sum.
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - name: Vet
        run: go vet ./...
      - name: Tests and race detector
        run: go test -race -count=1 -timeout=60s ./...

  docker-build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read version
        id: version
        run: |
          version=$(cat version.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build local image for runtime checks
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tg-ticket-monitor:ci
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runtime checks without credentials or network
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /app/data:uid=1000,gid=1000,mode=700 \
            tg-ticket-monitor:ci --check
          test "$(docker run --rm --network none tg-ticket-monitor:ci --version)" = "${{ steps.version.outputs.VERSION }}"
          test "$(docker inspect -f '{{.Config.User}}' tg-ticket-monitor:ci)" = "1000:1000"
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push release
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/tg-ticket-monitor:latest
            ${{ secrets.DOCKER_USERNAME }}/tg-ticket-monitor:${{ steps.version.outputs.VERSION }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
