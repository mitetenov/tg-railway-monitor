[pytest]
testpaths = tests
# check_syntax.py is a standalone script, not a pytest module.
python_files = test_*.py
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
# Live-API checks are opt-in: `pytest -m network`.
addopts = -m "not network"
markers =
    network: hits the upstream tkt.ge API; excluded from the default run
filterwarnings =
    ignore::DeprecationWarning:telegram.*
